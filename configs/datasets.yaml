version: 1

state:
  root: data/state
  request_log: data/state/request_log.csv
  lock: data/state/download.lock

sources:
  baostock:
    hard_max_requests_per_day: 50000
    safe_max_requests_per_day: 49000
    socket_timeout_seconds: 30
    stock_pool_queries:
      sz50: query_sz50_stocks
      hs300: query_hs300_stocks
      zz500: query_zz500_stocks
    fields:
      history:
        daily: [date, code, open, high, low, close, preclose, volume, amount, adjustflag, turn, tradestatus, pctChg, peTTM, pbMRQ, psTTM, pcfNcfTTM, isST]
        float32: [open, high, low, close, preclose, turn, pctChg, peTTM, pbMRQ, psTTM, pcfNcfTTM]
        query: [code, start, end]
        result: [code, start_date, end_date, target_path, status, row_count, error]
      dividend:
        data: [code, year, announce_date, record_date, operate_date, payment_date, cash_dividend_before_tax]
        query: [code, start, end]
        result: [code, year, status, row_count, error]
      profit_quarterly:
        data: [code, year, quarter, publish_date, report_date, total_shares]
        query: [code, start, end]
        result: [code, year, quarter, status, row_count, error]
        numeric: [total_shares]
      request_log: [date, time, endpoint, code, frequency, start_date, end_date]
  akshare:
    csindex_daily:
      codes: [H30269, H20269]
      fields: [日期, 指数代码, 收盘]
      result: [code, start_date, end_date, target_path, status, row_count, error]

datasets:
  stock_daily:
    description: Daily stock prices and valuation fields.
    source: baostock
    storage:
      kind: duckdb
      path: data/pyquant.duckdb
      relation: api.stock_daily
      requires_dates: true
    columns: [date, symbol, open, high, low, close, preclose, volume, amount, turn, pct_chg, pe_ttm, pb_mrq, ps_ttm, pcf_ncf_ttm, is_st]
    required: [date, symbol, close, amount, pe_ttm]
    primary_key: [date, symbol]
    date_column: date
    date_columns: [date]
    numeric_columns: [open, high, low, close, preclose, volume, amount, turn, pct_chg, pe_ttm, pb_mrq, ps_ttm, pcf_ncf_ttm]
    field_map: {code: symbol, pctChg: pct_chg, peTTM: pe_ttm, pbMRQ: pb_mrq, psTTM: ps_ttm, pcfNcfTTM: pcf_ncf_ttm, isST: is_st}
    update: {kind: history, target: stock, pool: true}

  index_daily:
    description: Daily index prices.
    source: baostock
    storage:
      kind: duckdb
      path: data/pyquant.duckdb
      relation: api.index_daily
      requires_dates: true
      normalize_symbols: false
    columns: [date, symbol, open, high, low, close, preclose, volume, amount, turn, pct_chg, pe_ttm, pb_mrq, ps_ttm, pcf_ncf_ttm, is_st]
    required: [date, symbol, close]
    primary_key: [date, symbol]
    date_column: date
    date_columns: [date]
    numeric_columns: [open, high, low, close, preclose, volume, amount, turn, pct_chg, pe_ttm, pb_mrq, ps_ttm, pcf_ncf_ttm]
    field_map: {code: symbol, pctChg: pct_chg, peTTM: pe_ttm, pbMRQ: pb_mrq, psTTM: ps_ttm, pcfNcfTTM: pcf_ncf_ttm, isST: is_st}
    update: {kind: history, target: index, pool: false}

  csindex_daily:
    description: Daily official CSI Dividend Low Volatility index prices.
    source: akshare
    storage:
      kind: duckdb
      path: data/pyquant.duckdb
      relation: api.index_daily
      requires_dates: true
      normalize_symbols: false
      allowed_symbols: [H30269, H20269]
    columns: [date, symbol, close]
    required: [date, symbol, close]
    primary_key: [date, symbol]
    date_column: date
    date_columns: [date]
    numeric_columns: [close]
    field_map: {日期: date, 指数代码: symbol, 收盘: close}
    update: {kind: csindex_history, pool: false}

  index_constituents:
    description: Changed snapshots of official index constituents from RQData.
    source: rqdata
    storage: {kind: duckdb, path: data/pyquant.duckdb, relation: api.index_constituents, requires_dates: false, normalize_symbols: true}
    columns: [effective_date, index_code, symbol]
    required: [effective_date, index_code, symbol]
    primary_key: [effective_date, index_code, symbol]
    date_column: effective_date
    date_columns: [effective_date]
    field_map: {}

  other_daily:
    description: Existing daily files for securities outside the stock dataset.
    source: baostock
    storage:
      kind: symbol_files
      path: data/raw/other_daily/{symbol}.parquet
      symbol_from: stem
    columns: [date, symbol, open, high, low, close, preclose, volume, amount, turn, pct_chg, pe_ttm, pb_mrq, ps_ttm, pcf_ncf_ttm, is_st]
    required: [date, symbol, close]
    primary_key: [date, symbol]
    date_column: date
    date_columns: [date]
    numeric_columns: [open, high, low, close, preclose, volume, amount, turn, pct_chg, pe_ttm, pb_mrq, ps_ttm, pcf_ncf_ttm]
    field_map: {code: symbol, pctChg: pct_chg, peTTM: pe_ttm, pbMRQ: pb_mrq, psTTM: ps_ttm, pcfNcfTTM: pcf_ncf_ttm, isST: is_st}

  dividend:
    description: Announced cash dividends per share.
    source: baostock
    storage: {kind: duckdb, path: data/pyquant.duckdb, relation: api.dividend, requires_dates: false}
    columns: [symbol, announce_date, record_date, operate_date, payment_date, cash_dividend_before_tax]
    required: [symbol, announce_date, cash_dividend_before_tax]
    primary_key: [symbol, announce_date, record_date, operate_date, payment_date, cash_dividend_before_tax]
    date_column: announce_date
    date_columns: [announce_date, record_date, operate_date, payment_date]
    numeric_columns: [cash_dividend_before_tax]
    field_map: {code: symbol, dividPlanAnnounceDate: announce_date, dividRegistDate: record_date, dividOperateDate: operate_date, dividPayDate: payment_date, dividCashPsBeforeTax: cash_dividend_before_tax}
    update: {kind: dividend, pool: true}

  dividend_queries:
    description: Completed dividend source queries, including empty results.
    source: generated
    storage: {kind: duckdb, path: data/pyquant.duckdb, relation: api.dividend_coverage, requires_dates: false}
    columns: [symbol, year]
    required: [symbol, year]
    primary_key: [symbol, year]
    numeric_columns: [year]
    field_map: {}

  stock_profit_quarterly:
    description: Quarterly publication dates and total shares.
    source: baostock
    storage: {kind: duckdb, path: data/pyquant.duckdb, relation: api.share_capital_quarterly, requires_dates: false}
    columns: [symbol, publish_date, report_date, total_shares]
    required: [symbol, publish_date, total_shares]
    primary_key: [symbol, report_date]
    date_column: publish_date
    date_columns: [publish_date, report_date]
    numeric_columns: [total_shares]
    field_map: {code: symbol, pubDate: publish_date, statDate: report_date, totalShare: total_shares}
    update: {kind: profit_quarterly, pool: true}

  stock_profit_quarterly_queries:
    description: Completed quarterly profit source queries, including empty results.
    source: generated
    storage: {kind: duckdb, path: data/pyquant.duckdb, relation: api.share_capital_coverage, requires_dates: false}
    columns: [symbol, year, quarter]
    required: [symbol, year, quarter]
    primary_key: [symbol, year, quarter]
    numeric_columns: [year, quarter]
    field_map: {}
