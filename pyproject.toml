[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyquant"
version = "0.1.0"
description = "Lightweight research toolkit for reproducing quantitative strategy reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "duckdb",
    "pyyaml",
    "matplotlib",
    "scipy",
    "statsmodels",
    "empyrical-reloaded",
]

[project.optional-dependencies]
data = [
    "baostock",
    "akshare",
    "rqdatac",
]
baostock = ["baostock"]
akshare = ["akshare"]
rqdatac = ["rqdatac"]
test = ["pytest"]
notebook = [
    "jupyterlab",
    "ipykernel",
]
backtest = ["vectorbt"]
report = ["quantstats"]
factor = ["alphalens-reloaded"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pyquant.data" = ["sql/*.sql"]
"strategies.div_low_vol" = ["config.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
